name: Android compile and unit tests
on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and compile unsigned APK
        run: |
          bash test.sh
          bash scripts/build-unsigned.sh
      - name: Upload unsigned APK (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: SantiCam-1.2.0-unsigned
          path: dist/ShizukaCamera-1.2.0-unsigned.apk
          retention-days: 2
